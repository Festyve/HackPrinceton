[project]
name = "alibi"
version = "0.1.0"
description = "ALIBI: a forensic proving ground. A bounded simulated adversary stages a synthetic incident, the simulator seals what happened, and an investigator is scored against it."
authors = [
    { name = "Eric Chen", email = "167908754+ericchen356@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "deepagents>=0.7.38",
    "duckdb>=1.1",
    "fastapi>=0.115",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "pydantic>=2.9",
    "python-dotenv>=1.2.4",
    "uvicorn>=0.30",
]

[project.scripts]
alibi = "alibi.cli:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28",
    "playwright>=1.50",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
